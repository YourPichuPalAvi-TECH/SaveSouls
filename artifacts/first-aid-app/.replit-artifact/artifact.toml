kind = "web"
previewPath = "/"
title = "First Aid & Medical Skills"
version = "1.0.0"
id = "artifacts/first-aid-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23010

[services.development]
run = "pnpm --filter @workspace/first-aid-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/first-aid-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/first-aid-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23010"
BASE_PATH = "/"
